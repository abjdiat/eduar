<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>日本語クイズ · Japanese Vocab Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f3f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
            color: #1e293b;
        }

        .quiz-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.15);
            padding: 1.5rem 1.2rem;
            transition: all 0.2s;
        }

        .header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: #eef2f6;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
        }

        .score-badge {
            background: #0f172a;
            color: white;
            padding: 0.35rem 1rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .progress-text {
            color: #334155;
            background: white;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .question-area {
            margin: 1.6rem 0 1.8rem;
        }

        .japanese-sentence {
            font-size: 1.4rem;
            line-height: 1.6;
            font-weight: 500;
            background: #f8fafc;
            padding: 1.2rem 1rem;
            border-radius: 22px;
            border-left: 6px solid #3b82f6;
            word-break: break-word;
            color: #0b1e3a;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin: 1.8rem 0 1rem;
        }

        .option-btn {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            padding: 1rem 1.4rem;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: left;
            color: #1e293b;
            transition: all 0.1s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 3px rgba(0,0,0,0.02);
            word-break: break-word;
            line-height: 1.4;
        }

        .option-btn:active {
            background: #f1f5f9;
            transform: scale(0.99);
        }

        .option-btn.selected-correct {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
            font-weight: 600;
        }

        .option-btn.selected-wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
            font-weight: 600;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        .option-btn.correct-highlight {
            border-color: #10b981;
            background: #ecfdf5;
        }

        .feedback-area {
            min-height: 2.8rem;
            margin: 0.5rem 0 1.2rem;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            text-align: center;
        }

        .feedback-correct {
            color: #065f46;
            background: #d1fae5;
            width: 100%;
        }

        .feedback-wrong {
            color: #991b1b;
            background: #fee2e2;
            width: 100%;
        }

        .feedback-neutral {
            color: #475569;
            background: #f1f5f9;
            width: 100%;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 0.5rem;
        }

        .nav-btn {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            padding: 0.85rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.1s;
            cursor: pointer;
            box-shadow: 0 4px 6px -2px rgba(0,0,0,0.05);
        }

        .nav-btn:active {
            background: #e2e8f0;
            transform: translateY(1px);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .key-hint {
            font-size: 0.75rem;
            color: #64748b;
            display: block;
            margin-top: 4px;
            font-weight: 400;
        }

        .footer-note {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 1.2rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 0.9rem;
        }

        /* small phones */
        @media (max-width: 400px) {
            .japanese-sentence {
                font-size: 1.2rem;
                padding: 1rem;
            }
            .option-btn {
                padding: 0.9rem 1rem;
                font-size: 1rem;
            }
            .quiz-container {
                padding: 1.2rem 0.9rem;
            }
        }
    </style>
</head>

                {"question": "なかなか 【なかなか】 かのじょ は え が なかなか じょうず です。  この えいが は なかなか おもしろい です ね。", "options": ["a variety of", "pretty, considerably", "door, sliding door", "daytime, midday"], "answer": "pretty, considerably"},
                {"question": "励ます 【はげます】 ちち が むすこ を はげました の。  たいせつな しけん の まえ、ともだち が はげまして くれました。", "options": ["encourage, cheer up", "feast, treat", "welcome (greeting)", "(individual) character, letter"], "answer": "encourage, cheer up"},
                {"question": "涙 【なみだ】 はは は なみだ を ながして いた。  かのじょ は なみだ を ながした ん だ。", "options": ["international", "about when, about what time", "tear", "most, best"], "answer": "tear"},
                {"question": "夢 【ゆめ】 わたし の ゆめ は せんせい に なる こと です。  わたし に は おおきな ゆめ が あります。", "options": ["strong", "important, valuable", "lively, exciting", "dream"], "answer": "dream"},
                {"question": "職場 【しょくば】 じたく から しょくば まで 1 じかん かかります。  わたし の しょくば は じょせい の ほう が おおい です。", "options": ["person (polite form)", "other (Japanese origin)", "anxiety, worry", "place of work, office"], "answer": "place of work, office"},
                {"question": "隣 【となり】 となり の いえ に は いぬ が います。  となり の へや から てれび の おと が きこえる。", "options": ["next to, next door", "more than, not less than", "healthy, sturdy", "diary"], "answer": "next to, next door"},
                {"question": "マンション 【まんしょん】 かれ は まんしょん に すんで います。  らいねん、ここ に おおきな まんしょん が できます。", "options": ["borrow", "escape, run away", "I, me (usually used by young males)", "apartment, residential building"], "answer": "apartment, residential building"},
                {"question": "エレベーター 【えれべーたー】 えれべーたー で した に おりましょう。  その えれべーたー は こしょう して いて つかえません。", "options": ["elevator", "enter", "burn", "under, below"], "answer": "elevator"},
                {"question": "窓 【まど】 まど を あけて ください。  とり が まど から にげた よ。", "options": ["window", "son", "same, identical", "under, below"], "answer": "window"},
                {"question": "押す 【おす】 ぼたん を おして ください。  まえ の ひと を おさないで ください。", "options": ["five days, fifth of the month", "push, press down", "together, at the same time", "there (polite)"], "answer": "push, press down"},
                {"question": "入学 【にゅうがく】 いもうと は く がつ に あめりか の だいがく に にゅうがく します。  し がつ に だいがく に にゅうがく しました。", "options": ["problem, question", "classroom, class", "enter a school, matriculate", "souvenir (polite)"], "answer": "enter a school, matriculate"},
                {"question": "戸 【と】 へや の と が あいて います。  そこ の と を しめて ください。", "options": ["decide, agree upon", "substitute, be substituted for", "typhoon", "door, sliding door"], "answer": "door, sliding door"},
                {"question": "通り 【とおり】 この とおり は にぎやか です ね。  この とおり は くるま の おと が うるさい。", "options": ["last long, be durable", "give (to an inferior)", "enough, plentiful", "street, road"], "answer": "street, road"},
                {"question": "亡くなる 【なくなる】 おととい、むかし の ゆうじん が なくなった。  そふ は きょねん、なくなりました。", "options": ["rice (grain)", "Japanese deep-fried food", "die, pass away", "right"], "answer": "die, pass away"},
                {"question": "夫婦 【ふうふ】 その ふうふ は とても なか が いい。  あね ふうふ に おとこのこ が うまれました。", "options": ["fast", "sea, ocean", "husband and wife, married couple", "every month"], "answer": "husband and wife, married couple"},
                {"question": "女性 【じょせい】 その ぱーてぃー に じょせい は なん にん きます か。  わたし の しょくば は じょせい の ほう が おおい です。", "options": ["forget, leave behind", "woman, female (formal)", "meal, cooked rice", "wear, put on"], "answer": "woman, female (formal)"},
                {"question": "森 【もり】 わたし は もり を あるく の が すき です。  その もり に は くま が すんで います。", "options": ["forest", "older, senior", "island (Japanese origin)", "breakfast (colloquial)"], "answer": "forest"},
                {"question": "トラック 【とらっく】 とらっく を うんてん できます か。  わたし たち は とらっく で その ぴあの を はこびました。", "options": ["truck", "answer, reply", "want, desire (of the speaker)", "cut"], "answer": "truck"},
                {"question": "レコード 【れこーど】 じゃず の れこーど を かけました。  ちち は ふるい れこーど を あつめて います。", "options": ["teach, tell", "change, turn into", "record", "five (things)"], "answer": "record"},
                {"question": "熱 【ねつ】 きのう の よる、ねつ が でました。  ねつ が ある ので おいしゃさん に いった。", "options": ["Japanese yen", "hot (of weather)", "old", "heat, fever"], "answer": "heat, fever"},
                {"question": "ページ 【ぺーじ】 きょうかしょ の 36 ぺーじ を ひらいて ください。  5 ぺーじ の さいしょ を みて ください。", "options": ["father, dad (colloquial)", "page", "success", "in short, that is to say"], "answer": "page"},
                {"question": "踊る 【おどる】 かのじょ は くらぶ で おどる の が すき です。  わかもの が みち で おどって いる。", "options": ["three days, third of the month", "slowly", "dance", "weak"], "answer": "dance"},
                {"question": "長さ 【ながさ】 この けーぶる の ながさ は 1 めーとる です。  きょう は ひる と よる の ながさ が おなじ です。", "options": ["menu", "length", "letter", "special"], "answer": "length"},
                {"question": "厚さ 【あつさ】 わたし は いた の あつさ を はかった。  この へや は かべ の あつさ が じゅうぶん で は ありません。", "options": ["parents", "in short, that is to say", "thickness", "hole"], "answer": "thickness"},
                {"question": "秘密 【ひみつ】 これ は ひみつ です。  かれ は いつも ひみつ を まもりません。", "options": ["(one's own) older sister (polite)", "next month", "secret, privacy", "school"], "answer": "secret, privacy"}
            ];

            // -------------------------------------------------------------
            // 2. STATE & PERSISTENCE
            // -------------------------------------------------------------
            const STORAGE_KEY = 'jpQuiz_progress_v1';
            let currentIndex = 0;
            let correctCount = 0;
            // We'll store answered state per question: { correct: bool }
            let answeredMap = {};  // key: question index, value: true/false

            // Load progress from localStorage
            function loadProgress() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (typeof data.currentIndex === 'number' && data.currentIndex >= 0 && data.currentIndex < quizData.length) {
                            currentIndex = data.currentIndex;
                        }
                        if (typeof data.correctCount === 'number') {
                            correctCount = data.correctCount;
                        }
                        if (data.answeredMap && typeof data.answeredMap === 'object') {
                            answeredMap = data.answeredMap;
                        }
                    }
                } catch (e) {
                    console.warn('Failed to load progress', e);
                }
            }

            // Save progress to localStorage
            function saveProgress() {
                try {
                    const data = {
                        currentIndex,
                        correctCount,
                        answeredMap
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    console.warn('Failed to save progress', e);
                }
            }

            // Reset / initialize fresh (but we don't want to auto-reset on load, only on button, so no reset here)
            // However we might need to ensure answeredMap consistency: if currentIndex out of range, clamp.
            function clampIndex() {
                if (currentIndex < 0) currentIndex = 0;
                if (currentIndex >= quizData.length) currentIndex = quizData.length - 1;
            }

            // -------------------------------------------------------------
            // 3. RENDER APP
            // -------------------------------------------------------------
            const app = document.getElementById('quizApp');

            function render() {
                clampIndex();
                const q = quizData[currentIndex];
                if (!q) return;

                const isAnswered = answeredMap.hasOwnProperty(currentIndex);
                const wasCorrect = isAnswered ? answeredMap[currentIndex] : null;

                // total questions answered count (for progress display)
                const answeredTotal = Object.keys(answeredMap).length;

                // Build options HTML with appropriate highlighting
                let optionsHtml = '';
                q.options.forEach((opt) => {
                    let btnClass = 'option-btn';
                    if (isAnswered) {
                        btnClass += ' disabled';
                        if (opt === q.answer) {
                            btnClass += ' correct-highlight';  // always highlight correct answer
                        }
                        // If this option was the user's selected? We need to know which one user chose.
                        // But we only store correct/incorrect per question, not the chosen option.
                        // For better UX, we can show which was wrong? Not stored. Let's re-think:
                        // We'll store only correctness. To show which option was chosen, we'd need to store chosen. Let's augment.
                        // Actually, we can store 'selectedOption' per question. But to keep it simple, we'll just show correct highlight and feedback.
                        // However, to indicate "selected wrong", we can compare with a stored chosenOption.
                        // Let's add that to answeredMap: store { correct: bool, chosen: string }
                    }
                    // We'll modify: answeredMap stores { correct, chosen }
                    // So we need to adjust. Let's refactor quickly.
                });

                // Rebuild with new answeredMap structure: { correct: boolean, chosen: string }
                // We'll convert any legacy flat booleans.
                // (Do this once at load)
                // But we already loaded. We'll handle in loadProgress.
                // For now, adjust render:
                let optionsHtml2 = '';
                q.options.forEach((opt) => {
                    let btnClass = 'option-btn';
                    let isSelected = false;
                    if (isAnswered) {
                        btnClass += ' disabled';
                        const ansData = answeredMap[currentIndex]; // should be object
                        const chosen = ansData.chosen;
                        if (opt === q.answer) {
                            btnClass += ' correct-highlight';
                        }
                        if (opt === chosen && chosen !== q.answer) {
                            btnClass += ' selected-wrong';
                        } else if (opt === chosen && chosen === q.answer) {
                            btnClass += ' selected-correct';
                        }
                    }
                    optionsHtml2 += `<button class="${btnClass}" data-option="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`;
                });

                // Feedback text
                let feedbackHtml = '';
                if (isAnswered) {
                    const ansData = answeredMap[currentIndex];
                    if (ansData.correct) {
                        feedbackHtml = `<div class="feedback-area feedback-correct">✅ Correct! 正解です</div>`;
                    } else {
                        feedbackHtml = `<div class="feedback-area feedback-wrong">❌ Incorrect. 正解: ${escapeHtml(q.answer)}</div>`;
                    }
                } else {
                    feedbackHtml = `<div class="feedback-area feedback-neutral">Tap an option or use ← → keys</div>`;
                }

                // Progress: current position and score
                const totalQuestions = quizData.length;
                const progressText = `${currentIndex + 1} / ${totalQuestions}`;
                const scoreText = `⭐ ${correctCount} correct`;

                const html = `
                    <div class="header-stats">
                        <span class="score-badge">${scoreText}</span>
                        <span class="progress-text">${progressText}</span>
                    </div>
                    <div class="question-area">
                        <div class="japanese-sentence">${escapeHtml(q.question)}</div>
                    </div>
                    <div class="options-grid" id="optionsContainer">
                        ${optionsHtml2}
                    </div>
                    ${feedbackHtml}
                    <div class="nav-buttons">
                        <button class="nav-btn" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Prev <span class="key-hint">←</span></button>
                        <button class="nav-btn" id="nextBtn" ${currentIndex === quizData.length - 1 ? 'disabled' : ''}>Next ▶ <span class="key-hint">→</span></button>
                    </div>
                    <div class="footer-note">
                        ${answeredTotal} answered · ${quizData.length - answeredTotal} remaining
                    </div>
                `;

                app.innerHTML = html;

                // Attach event listeners to options (if not answered)
                const optionBtns = document.querySelectorAll('.option-btn');
                if (!isAnswered) {
                    optionBtns.forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const selected = e.currentTarget.dataset.option;
                            handleAnswer(selected);
                        });
                    });
                } else {
                    // If already answered, ensure no pointer events (already disabled class)
                }

                // Nav buttons
                document.getElementById('prevBtn')?.addEventListener('click', goPrev);
                document.getElementById('nextBtn')?.addEventListener('click', goNext);

                // Save current position whenever rendered
                saveProgress();
            }

            // Helper to escape HTML
            function escapeHtml(unsafe) {
                return unsafe.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // Handle answer selection
            function handleAnswer(selectedOption) {
                if (answeredMap.hasOwnProperty(currentIndex)) return; // already answered

                const q = quizData[currentIndex];
                const isCorrect = selectedOption === q.answer;

                // store result
                answeredMap[currentIndex] = {
                    correct: isCorrect,
                    chosen: selectedOption
                };

                if (isCorrect) {
                    correctCount += 1;
                }

                // save progress
                saveProgress();

                // re-render to show feedback and correct highlight
                render();
            }

            // Navigation
            function goPrev() {
                if (currentIndex > 0) {
                    currentIndex--;
                    saveProgress();
                    render();
                }
            }

            function goNext() {
                if (currentIndex < quizData.length - 1) {
                    currentIndex++;
                    saveProgress();
                    render();
                }
            }

            // -------------------------------------------------------------
            // 4. KEYBOARD LISTENER
            // -------------------------------------------------------------
            window.addEventListener('keydown', (e) => {
                // Left arrow -> prev
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goPrev();
                }
                // Right arrow -> next
                else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goNext();
                }
                // Optional: number keys 1-4 to select options quickly
                else if (['1', '2', '3', '4'].includes(e.key)) {
                    e.preventDefault();
                    const q = quizData[currentIndex];
                    if (!q) return;
                    if (answeredMap.hasOwnProperty(currentIndex)) return; // already answered
                    const idx = parseInt(e.key) - 1;
                    if (idx >= 0 && idx < q.options.length) {
                        handleAnswer(q.options[idx]);
                    }
                }
            });

            // -------------------------------------------------------------
            // 5. INIT
            // -------------------------------------------------------------
            function migrateAnsweredMap() {
                // If any value is boolean, convert to object
                const newMap = {};
                for (const [k, v] of Object.entries(answeredMap)) {
                    if (typeof v === 'boolean') {
                        // legacy: we don't know chosen, set chosen to null
                        newMap[k] = { correct: v, chosen: null };
                    } else {
                        newMap[k] = v;
                    }
                }
                answeredMap = newMap;
            }

            // Run initialization
            loadProgress();
            migrateAnsweredMap();
            // Ensure correctCount matches answeredMap
            let recomputedCorrect = 0;
            for (const [k, v] of Object.entries(answeredMap)) {
                if (v.correct === true) recomputedCorrect++;
            }
            correctCount = recomputedCorrect;
            clampIndex();
            render();

            // Expose reset function for convenience? Not needed.
            // But we can add a hidden reset via localStorage clear: not exposed.
            // Optional: double-click on score to reset (just for fun, but might confuse)
            // We'll avoid.

            // Save on page unload
            window.addEventListener('beforeunload', () => {
                saveProgress();
            });

        })();
    </script>
