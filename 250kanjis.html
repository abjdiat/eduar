        }

        }
        button {
            font-family: inherit;
            font-size: 1rem;
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            background: #e8e5e0;
            color: #1e1e1e;
            font-weight: 500;
            width: 100%;
            text-align: center;
            -webkit-appearance: none;
            appearance: none;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: #1e1e1e;
            color: #fff;
        }
        .btn-primary:active {
            background: #333;
        }
        .btn-accent {
            background: #d97747;
            color: #fff;
        }
        .btn-accent:active {
            background: #c1663a;
        }
        .btn-success {
            background: #2e7d32;
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #ccc;
        }
        .btn-sm {
            padding: 10px 14px;
            font-size: 0.9rem;
            width: auto;
            border-radius: 12px;
        }
        .flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .flex-1 {
            flex: 1;
        }
        .gap-8 {
            gap: 8px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .text-center {
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .progress-bar {
            height: 6px;
            background: #e0ddd8;
            border-radius: 6px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            background: #1e1e1e;
            transition: width 0.3s ease;
            border-radius: 6px;
        }

        /* ---------- LESSON LIST ---------- */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .lesson-card {
            background: #fff;
            border-radius: 16px;
            padding: 14px 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.15s;
            border: 2px solid transparent;
            text-align: left;
        }
        .lesson-card:active {
            transform: scale(0.97);
        }
        .lesson-card .num {
            font-size: 0.75rem;
            font-weight: 700;
            color: #d97747;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .lesson-card .title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 2px 0 4px;
            line-height: 1.3;
        }
        .lesson-card .count {
            font-size: 0.75rem;
            color: #888;
        }

        /* ---------- FLASHCARD ---------- */
        .flashcard {
            background: #fff;
            border-radius: 24px;
            padding: 32px 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .flashcard .kanji-big {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 8px;
            color: #1e1e1e;
        }
        .flashcard .reading {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .flashcard .meaning {
            font-size: 1rem;
            color: #777;
            font-style: italic;
        }
        .flashcard .hint {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 16px;
        }
        .flashcard.flipped .kanji-big {
            display: none;
        }
        .flashcard.flipped .reading,
        .flashcard.flipped .meaning {
            display: block;
        }
        .flashcard:not(.flipped) .reading,
        .flashcard:not(.flipped) .meaning {
            visibility: hidden;
            display: none;
        }

        /* ---------- QUIZ ---------- */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .quiz-question {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.3;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .quiz-option {
            background: #fff;
            border: 2px solid #e8e5e0;
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            width: 100%;
        }
        .quiz-option:active {
            transform: scale(0.98);
        }
        .quiz-option.correct {
            background: #e8f5e9;
            border-color: #2e7d32;
            color: #1b5e20;
        }
        .quiz-option.wrong {
            background: #fbe9e7;
            border-color: #c62828;
            color: #b71c1c;
        }
        .quiz-option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .quiz-option.selected {
            border-color: #1e1e1e;
        }
        .quiz-feedback {
            margin-top: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            min-height: 24px;
        }
        .quiz-feedback.correct {
            color: #2e7d32;
        }
        .quiz-feedback.wrong {
            color: #c62828;
        }

        .result-screen {
            text-align: center;
            padding: 30px 10px;
        }
        .result-screen .big-score {
            font-size: 3.5rem;
            font-weight: 700;
            color: #1e1e1e;
        }
        .result-screen .label {
            font-size: 1rem;
            color: #777;
            margin-bottom: 20px;
        }

            display: flex;
            justify-content: space-between;

            gap: 10px;
            margin-bottom: 12px;

            padding: 4px;
            gap: 4px;

            flex: 1;
            padding: 10px 8px;
            font-size: 0.85rem;
            border-radius: 10px;
            background: transparent;
            font-weight: 500;
            color: #666;
        }
        .mode-toggle button.active {
            background: #fff;
            color: #1e1e1e;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e1e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;

            }

                padding: 10px;
            }
            .lesson-card .title {

            }
        }

        // ============================================================
        //  STATE & PERSISTENCE
        // ============================================================
        const STORAGE_KEY = 'kanji250_progress';

        function loadProgress() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return { quizAnswered: {}, wrongCount: {}, lastLesson: null };
                return JSON.parse(raw);
            } catch {
                return { quizAnswered: {}, wrongCount: {}, lastLesson: null };
            }
        }

        function saveProgress(progress) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            } catch { /* ignore */ }
        }

        let progress = loadProgress();

        // ============================================================
        //  APP STATE
        // ============================================================
        const state = {
            screen: 'home',          // home | study | quiz | quizResult
            lessonId: null,
            cardIndex: 0,
            flipped: false,
            quizMode: 'kanjiToMeaning', // 'kanjiToMeaning' | 'meaningToKanji'
            quizQuestions: [],
            quizIndex: 0,
            quizSelected: null,
            quizFeedback: '',
            quizFeedbackType: '',
            quizScore: 0,
            quizTotal: 0,
            quizFinished: false,
        };

        // ============================================================
        //  HELPERS
        // ============================================================
        function getLesson(id) {
            return LESSONS.find(l => l.id === id);
        }

        function getAllKanji() {
            const all = [];
            LESSONS.forEach(l => l.kanji.forEach(k => all.push(k)));
            return all;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function showToast(msg) {
            let el = document.querySelector('.toast');
            if (!el) {
                el = document.createElement('div');
                el.className = 'toast';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 2000);
        }

        // ============================================================
        //  RENDER
        // ============================================================
        const app = document.getElementById('app');

        function render() {
            if (state.screen === 'home') renderHome();
            else if (state.screen === 'study') renderStudy();
            else if (state.screen === 'quiz') renderQuiz();
            else if (state.screen === 'quizResult') renderQuizResult();
        }

        // ---------- HOME ----------
        function renderHome() {
            const totalKanji = LESSONS.reduce((sum, l) => sum + l.kanji.length, 0);

            let html = `
                <div class="card" style="text-align:center; padding: 24px 16px;">
                    <h1 style="font-size: 1.8rem;">250 Kanji</h1>
                    <p class="sub" style="margin-bottom: 4px;">JLPT N5 · Volume 1</p>
                    <p class="sub" style="font-size: 0.8rem;">${totalKanji} characters across ${LESSONS.length} lessons</p>
                </div>

                <div class="card">
                    <h2>Study Mode</h2>
                    <p class="sub mb-12">Tap a lesson to view its kanji flashcards.</p>
                    <div class="lesson-grid" id="lessonGrid">
                        ${LESSONS.map(l => `
                            <div class="lesson-card" data-lesson="${l.id}">
                                <div class="num">Lesson ${l.id}</div>
                                <div class="title">${l.title}</div>
                                <div class="count">${l.kanji.length} kanji</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="card">
                    <h2>Quiz Mode</h2>
                    <p class="sub mb-12">Test your knowledge with a multiple-choice quiz across all 250 kanji.</p>
                    <div class="mode-toggle mb-12" id="quizModeToggle">
                        <button data-mode="kanjiToMeaning" class="active">Kanji → Meaning</button>
                        <button data-mode="meaningToKanji">Meaning → Kanji</button>
                    </div>
                    <button class="btn-primary" id="startQuizBtn">Start Full Quiz (250)</button>
                </div>
            `;
            app.innerHTML = html;

            // Lesson click -> study
            document.querySelectorAll('.lesson-card').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.dataset.lesson);
                    state.lessonId = id;
                    state.cardIndex = 0;
                    state.flipped = false;
                    state.screen = 'study';
                    render();
                });
            });

            // Quiz mode toggle
            document.querySelectorAll('#quizModeToggle button').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#quizModeToggle button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.quizMode = btn.dataset.mode;
                });
            });

            // Start quiz
            document.getElementById('startQuizBtn').addEventListener('click', () => {
                startQuiz(getAllKanji());
            });
        }

        // ---------- STUDY (FLASHCARDS) ----------
        function renderStudy() {
            const lesson = getLesson(state.lessonId);
            if (!lesson) { state.screen = 'home'; render(); return; }

            const kanji = lesson.kanji;
            const idx = state.cardIndex;
            const k = kanji[idx];
            const total = kanji.length;

            let html = `
                <div class="nav-bar">
                    <button class="btn-sm btn-outline" id="backHome">← Home</button>
                    <span class="badge">Lesson ${lesson.id}</span>
                    <span class="badge">${idx + 1} / ${total}</span>
                </div>

                <div class="flashcard ${state.flipped ? 'flipped' : ''}" id="flashcard">
                    <div class="kanji-big">${k.char}</div>
                    <div class="reading">${k.readings}</div>
                    <div class="meaning">${k.meaning}</div>
                    <div class="hint">${state.flipped ? 'Tap to hide readings' : 'Tap to reveal readings & meaning'}</div>
                </div>

                <div class="flex mt-12 gap-8">
                    <button class="btn-outline flex-1" id="prevCard" ${idx === 0 ? 'disabled style="opacity:0.4"' : ''}>← Prev</button>
                    <button class="btn-outline flex-1" id="nextCard" ${idx === total - 1 ? 'disabled style="opacity:0.4"' : ''}>Next →</button>
                </div>

                <div class="flex mt-8 gap-8">
                    <button class="btn-accent flex-1" id="quizThisLesson">Quiz this lesson</button>
                </div>
            `;
            app.innerHTML = html;

            // Flip card
            document.getElementById('flashcard').addEventListener('click', () => {
                state.flipped = !state.flipped;
                renderStudy();
            });

            // Prev / Next
            document.getElementById('prevCard').addEventListener('click', () => {
                if (state.cardIndex > 0) {
                    state.cardIndex--;
                    state.flipped = false;
                    renderStudy();
                }
            });
            document.getElementById('nextCard').addEventListener('click', () => {
                if (state.cardIndex < total - 1) {
                    state.cardIndex++;
                    state.flipped = false;
                    renderStudy();
                }
            });

            // Back
            document.getElementById('backHome').addEventListener('click', () => {
                state.screen = 'home';
                render();
            });

            // Quiz this lesson
            document.getElementById('quizThisLesson').addEventListener('click', () => {
                startQuiz(lesson.kanji);
            });
        }

        // ---------- QUIZ ----------
        function startQuiz(kanjiPool) {
            const pool = shuffle(kanjiPool);
            state.quizQuestions = pool;
            state.quizIndex = 0;
            state.quizScore = 0;
            state.quizTotal = pool.length;
            state.quizFinished = false;
            state.quizSelected = null;
            state.quizFeedback = '';
            state.quizFeedbackType = '';
            state.screen = 'quiz';
            render();
        }

        function renderQuiz() {
            const q = state.quizQuestions[state.quizIndex];
            const total = state.quizTotal;
            const idx = state.quizIndex;
            const progressPct = ((idx) / total) * 100;

            // Build options: 3 wrong + correct
            const all = getAllKanji();
            const wrongPool = all.filter(k => k.id !== q.id);
            const wrong = shuffle(wrongPool).slice(0, 3);

            let questionText, correctAnswer, options;

            if (state.quizMode === 'kanjiToMeaning') {
                questionText = `What is the meaning of <span style="font-size:1.8rem; font-weight:700;">${q.char}</span>?`;
                correctAnswer = q.meaning;
                options = shuffle([q.meaning, ...wrong.map(w => w.meaning)]);
            } else {
                questionText = `Which kanji means "<strong>${q.meaning}</strong>"?`;
                correctAnswer = q.char;
                options = shuffle([q.char, ...wrong.map(w => w.char)]);
            }

            // Check if already answered this question
            const answeredKey = `q_${state.quizIndex}`;
            const hasAnswered = progress.quizAnswered[answeredKey] !== undefined;
            const selectedAnswer = hasAnswered ? progress.quizAnswered[answeredKey] : null;

            let html = `
                <div class="nav-bar">
                    <button class="btn-sm btn-outline" id="quitQuiz">✕ Quit</button>
                    <span class="badge">${idx + 1} / ${total}</span>
                </div>

                <div class="progress-bar mb-12">
                    <div class="progress-fill" style="width:${progressPct}%"></div>
                </div>

                <div class="card" style="min-height: 260px; display:flex; flex-direction:column; justify-content:center;">
                    <div class="quiz-question">${questionText}</div>
                    <div class="quiz-options" id="quizOptions">
                        ${options.map(opt => {
                            let cls = 'quiz-option';
                            if (selectedAnswer !== null) {
                                cls += ' disabled';
                                if (opt === correctAnswer) cls += ' correct';
                                else if (opt === selectedAnswer) cls += ' wrong';
                            }
                            return `<button class="${cls}" data-answer="${opt.replace(/"/g, '&quot;')}">${opt}</button>`;
                        }).join('')}
                    </div>
                    <div class="quiz-feedback ${selectedAnswer === correctAnswer ? 'correct' : selectedAnswer ? 'wrong' : ''}" id="quizFeedback">
                        ${selectedAnswer !== null ? (selectedAnswer === correctAnswer ? '✓ Correct!' : `✗ Correct answer: ${correctAnswer}`) : ''}
                    </div>
                </div>

                <div class="flex mt-12 gap-8">
                    <button class="btn-primary flex-1" id="nextQuizBtn" ${selectedAnswer === null ? 'disabled style="opacity:0.4"' : ''}>
                        ${idx < total - 1 ? 'Next →' : 'See Results'}
                    </button>
                </div>
            `;
            app.innerHTML = html;

            // Option clicks
            if (selectedAnswer === null) {
                document.querySelectorAll('#quizOptions .quiz-option').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const chosen = btn.dataset.answer;
                        progress.quizAnswered[answeredKey] = chosen;
                        if (chosen === correctAnswer) {
                            state.quizScore++;
                        } else {
                            const wrongKey = `w_${q.id}`;
                            progress.wrongCount[wrongKey] = (progress.wrongCount[wrongKey] || 0) + 1;
                        }
                        saveProgress(progress);
                        renderQuiz();
                    });
                });
            }

            // Next
            document.getElementById('nextQuizBtn').addEventListener('click', () => {
                if (state.quizIndex < total - 1) {
                    state.quizIndex++;
                    renderQuiz();
                } else {
                    state.quizFinished = true;
                    state.screen = 'quizResult';
                    render();
                }
            });

            // Quit
            document.getElementById('quitQuiz').addEventListener('click', () => {
                state.screen = 'home';
                render();
            });
        }

        // ---------- QUIZ RESULT ----------
        function renderQuizResult() {
            const score = state.quizScore;
            const total = state.quizTotal;
            const pct = total > 0 ? Math.round((score / total) * 100) : 0;

            let html = `
                <div class="card result-screen">
                    <div class="big-score">${score} / ${total}</div>
                    <div class="label">${pct}% correct</div>
                    <div style="font-size:0.95rem; color:#555; margin-bottom:24px;">
                        ${pct >= 90 ? '🌟 Excellent!' : pct >= 70 ? '👍 Good job!' : pct >= 50 ? '📖 Keep studying!' : '💪 Practice makes perfect!'}
                    </div>
                    <div class="flex gap-8" style="justify-content:center; flex-wrap:wrap;">
                        <button class="btn-primary" id="retryQuiz" style="width:auto; flex:1; min-width:140px;">Retry Quiz</button>
                        <button class="btn-outline" id="backHomeFromResult" style="width:auto; flex:1; min-width:140px;">Home</button>
                    </div>
                </div>
            `;
            app.innerHTML = html;

            document.getElementById('retryQuiz').addEventListener('click', () => {
                startQuiz(getAllKanji());
            });
            document.getElementById('backHomeFromResult').addEventListener('click', () => {
                state.screen = 'home';
                render();
            });
        }

        // ============================================================
        //  BOOT
        // ============================================================
        render();
    </script>
</body>
</html>
